version: '3.9'

services:
  web:
    image: node:20
    working_dir: /app
    volumes:
      - .:/app
    command: sh -lc "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

  api:
    image: python:3.12
    working_dir: /app
    volumes:
      - ./tara/backend:/app
    command: sh -lc "pip install --upgrade pip && pip install -r <(python - <<'PY'
import tomllib
with open('pyproject.toml','rb') as f:
    data = tomllib.load(f)
print(' '.join(data['project']['dependencies']))
PY
) && uvicorn app.api:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    env_file:
      - ./tara/backend/.env

  voice:
    image: python:3.12
    working_dir: /app
    volumes:
      - ./tara/backend:/app
    command: sh -lc "pip install --upgrade pip && pip install -r <(python - <<'PY'
import tomllib
with open('pyproject.toml','rb') as f:
    data = tomllib.load(f)
print(' '.join(data['project']['dependencies']))
PY
) && python -m app.agent dev"
    env_file:
      - ./tara/backend/.env
